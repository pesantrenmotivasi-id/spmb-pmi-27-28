<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Berkas | Pesantren Motivasi Indonesia</title>
  <link rel="icon" type="image/png" href="1.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    
    :root {
      --coklat-logo: #4A2B12; 
      --gold-logo: #C29B57;   
      --bg-krem: #FAF8F5;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-krem);
      color: #2C2A29;
    }
    .font-serif-custom { font-family: 'Playfair Display', serif; }
    .bg-coklat-logo { background-color: var(--coklat-logo); }
    .text-coklat-logo { color: var(--coklat-logo); }
    .text-gold { color: var(--gold-logo); }
    .bg-gold { background-color: var(--gold-logo); }
  </style>
</head>
<body class="flex h-screen overflow-hidden bg-[#FAF8F5]">

  <!-- SIDEBAR (Kiri) -->
  <aside class="w-64 bg-coklat-logo text-white flex flex-col shadow-2xl hidden md:flex relative z-20">
    <div class="p-6 flex items-center gap-4 border-b border-white/10">
      <img src="1.png" alt="Logo PMI" class="w-12 h-12 bg-white rounded-full p-1 object-contain">
      <div>
        <h1 class="font-bold font-serif-custom text-gold leading-tight">SPMB PMI</h1>
        <p class="text-[10px] text-gray-300">Tahun Ajaran 2027/2028</p>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
      <a href="dashboard-santri.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-home w-5 text-center"></i> Beranda
      </a>
      <a href="biodata-santri.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-user-edit w-5 text-center"></i> Biodata Diri
      </a>
      <a href="upload-berkas.html" class="flex items-center gap-3 px-4 py-3 bg-gold/20 text-gold rounded-xl border border-gold/30 font-semibold transition-all">
        <i class="fas fa-file-upload w-5 text-center"></i> Upload Berkas
      </a>
      <a href="pembayaran.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-wallet w-5 text-center"></i> Pembayaran
      </a>
      <a href="pengumuman.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-bullhorn w-5 text-center"></i> Pengumuman
      </a>
    </nav>

    <div class="p-4 border-t border-white/10">
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-xl transition-all">
        <i class="fas fa-sign-out-alt w-5 text-center"></i> Keluar
      </a>
    </div>
  </aside>

  <!-- MAIN CONTENT (Kanan) -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center z-10">
      <h2 class="text-xl font-bold text-gray-800">Upload Berkas Persyaratan</h2>
      <div class="flex items-center gap-3 border-l pl-6 border-gray-200">
        <div class="text-right hidden sm:block">
          <p id="teksHeader" class="text-sm font-bold text-gray-800">Calon Santri</p>
          <p id="teksNoPendaftaran" class="text-xs text-gray-500">No: SPMB-27-000</p>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-6 md:p-8">
      <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100">
          
          <h3 class="text-xl font-bold font-serif-custom text-coklat-logo mb-2">
            <i class="fas fa-cloud-upload-alt text-gold mr-2"></i> Form Unggah Berkas
          </h3>
          <p class="text-xs text-gray-500 mb-6">Format yang diperbolehkan: JPG, PNG, atau PDF (Maks. 5MB per file).</p>

          <form id="formBerkas" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Pas Foto -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">1. Pas Foto (3x4 / 4x6)</label>
                <input type="file" id="filePasFoto" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20">
              </div>

              <!-- Kartu Keluarga -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">2. Kartu Keluarga (KK)</label>
                <input type="file" id="fileKK" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20">
              </div>

              <!-- Akta Kelahiran -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">3. Akta Kelahiran</label>
                <input type="file" id="fileAkta" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20">
              </div>

              <!-- Ijazah / SKL -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">4. Ijazah / SKL / Raport</label>
                <input type="file" id="fileIjazah" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20">
              </div>
            </div>

            <button type="submit" id="btnUpload" class="w-full bg-gold hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-gold/30 transition-all flex items-center justify-center gap-2 mt-6">
              <i class="fas fa-upload"></i> <span>Unggah Semua Berkas</span>
            </button>
          </form>

        </div>
      </div>
    </div>
  </main>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT KHUSUS BERKAS KAMU DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyU_nI-bKLHNvz0Yj6MOEu22ihdAyIE1NK6gwuIlY7kDQKH3N6b0_8qyx-ZAJwXwxuFhQ/exec";

    const noPendaftar = localStorage.getItem('noPendaftaran') || 'SPMB-27-001';
    document.getElementById('teksNoPendaftaran').innerText = 'No: ' + noPendaftar;

    // Fungsi konversi file ke Base64
    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve({
        base64: reader.result.split(',')[1],
        mimeType: file.type,
        name: file.name
      });
      reader.onerror = error => reject(error);
    });

    document.getElementById('formBerkas').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnUpload');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengunggah ke Google Drive...';

      try {
        const pasFotoObj = await toBase64(document.getElementById('filePasFoto').files[0]);
        const kkObj = await toBase64(document.getElementById('fileKK').files[0]);
        const aktaObj = await toBase64(document.getElementById('fileAkta').files[0]);
        const ijazahObj = await toBase64(document.getElementById('fileIjazah').files[0]);

        const payload = {
          noPendaftaran: noPendaftar,
          pasFoto: pasFotoObj,
          kartuKeluarga: kkObj,
          aktaKelahiran: aktaObj,
          ijazah: ijazahObj
        };

        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('Semua Berkas Berhasil Diunggah ke Google Drive!');
        window.location.href = 'pembayaran.html';

      } catch (err) {
        console.error(err);
        alert('Gagal mengunggah berkas. Coba lagi!');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload"></i> Unggah Semua Berkas';
      }
    });
  </script>
</body>
</html>
