<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Berkas | Pesantren Motivasi Indonesia</title>
  <link rel="icon" type="image/png" href="1.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    
    :root {
      --coklat-logo: #4A2B12; 
      --gold-logo: #C29B57;   
      --bg-krem: #FAF8F5;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-krem);
      color: #2C2A29;
    }
    .font-serif-custom { font-family: 'Playfair Display', serif; }
    
    .bg-coklat-logo { background-color: var(--coklat-logo); }
    .text-coklat-logo { color: var(--coklat-logo); }
    .border-coklat-logo { border-color: var(--coklat-logo); }
    
    .bg-gold { background-color: var(--gold-logo); }
    .text-gold { color: var(--gold-logo); }
    .border-gold { border-color: var(--gold-logo); }
  </style>
</head>
<body class="flex h-screen overflow-hidden bg-[#FAF8F5]">

  <!-- OVERLAY BACKDROP UNTUK MOBILE SIDEBAR -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR (Kiri) -->
  <aside id="sidebar" class="w-64 bg-coklat-logo text-white flex flex-col shadow-2xl fixed md:relative inset-y-0 left-0 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
    <div class="p-6 flex items-center gap-4 border-b border-white/10">
      <img src="1.png" alt="Logo PMI" class="w-12 h-12 bg-white rounded-full p-1 object-contain">
      <div>
        <h1 class="font-bold font-serif-custom text-gold leading-tight">SPMB PMI</h1>
        <p class="text-[10px] text-gray-300">Tahun Ajaran 2027/2028</p>
      </div>
    </div>

    <!-- Menu Navigasi -->
    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
      <a href="dashboard-santri.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-home w-5 text-center"></i> Beranda
      </a>
      <a href="biodata-santri.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-user-edit w-5 text-center"></i> Biodata Diri
      </a>
      <a href="upload-berkas.html" class="flex items-center gap-3 px-4 py-3 bg-gold/20 text-gold rounded-xl border border-gold/30 font-semibold transition-all">
        <i class="fas fa-file-upload w-5 text-center"></i> Upload Berkas
      </a>
      <a href="pembayaran.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-wallet w-5 text-center"></i> Pembayaran
      </a>
      <a href="pengumuman.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-bullhorn w-5 text-center"></i> Pengumuman
      </a>
    </nav>

    <div class="p-4 border-t border-white/10">
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-xl transition-all">
        <i class="fas fa-sign-out-alt w-5 text-center"></i> Keluar
      </a>
    </div>
  </aside>

  <!-- MAIN CONTENT (Kanan) -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <!-- HEADER -->
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center z-10">
      <button onclick="toggleSidebar()" class="md:hidden text-coklat-logo text-xl p-2 focus:outline-none">
        <i class="fas fa-bars"></i>
      </button>

      <h2 class="text-xl font-bold text-gray-800 hidden md:block">Upload Berkas Persyaratan</h2>

      <div class="flex items-center gap-6 ml-auto md:ml-0">
        <a href="pengumuman.html" class="text-gray-400 hover:text-gold relative transition-colors">
          <i class="fas fa-bell text-xl"></i>
          <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
        </a>
        
        <div class="flex items-center gap-3 border-l pl-6 border-gray-200">
          <div class="text-right hidden sm:block">
            <p id="teksHeader" class="text-sm font-bold text-gray-800">Calon Santri</p>
            <p id="teksNoPendaftaran" class="text-xs text-gray-500">No: SPMB-27-001</p>
          </div>
          <div id="teksInisial" class="w-10 h-10 rounded-full bg-coklat-logo text-white flex items-center justify-center font-bold font-serif-custom shadow-md border-2 border-gold">
            CS
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <div class="flex-1 overflow-y-auto p-6 md:p-8">
      <div class="max-w-4xl mx-auto space-y-6">

        <!-- FORM UPLOAD -->
        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100">
          
          <h3 class="text-xl font-bold font-serif-custom text-coklat-logo mb-1 flex items-center gap-2">
            <i class="fas fa-cloud-upload-alt text-gold"></i> Form Unggah Berkas Persyaratan
          </h3>
          <p class="text-xs text-gray-500 mb-6">Pilih 4 berkas persyaratan di bawah ini (Format: JPG, PNG, PDF).</p>

          <form id="formBerkas" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              <!-- 1. Pas Foto -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50/50 hover:border-gold transition-colors">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">1. Pas Foto Santri (3x4 / 4x6) <span class="text-red-500">*</span></label>
                <input type="file" id="filePasFoto" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20 cursor-pointer">
              </div>

              <!-- 2. Kartu Keluarga -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50/50 hover:border-gold transition-colors">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">2. Kartu Keluarga (KK) <span class="text-red-500">*</span></label>
                <input type="file" id="fileKK" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20 cursor-pointer">
              </div>

              <!-- 3. Akta Kelahiran -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50/50 hover:border-gold transition-colors">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">3. Akta Kelahiran <span class="text-red-500">*</span></label>
                <input type="file" id="fileAkta" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20 cursor-pointer">
              </div>

              <!-- 4. Ijazah / SKL -->
              <div class="p-4 border border-gray-200 rounded-xl bg-gray-50/50 hover:border-gold transition-colors">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">4. Ijazah / SKL / Rapor Terakhir <span class="text-red-500">*</span></label>
                <input type="file" id="fileIjazah" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gold/10 file:text-gold hover:file:bg-gold/20 cursor-pointer">
              </div>

            </div>

            <button type="submit" id="btnUpload" class="w-full bg-gold hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-gold/30 transition-all flex items-center justify-center gap-2 mt-6">
              <i class="fas fa-upload"></i> <span>Unggah Semua Berkas</span>
            </button>
          </form>

        </div>
      </div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfxbUBZDngOAQo_nGzlcKxRhnkpa96NOApwrKG16RpHaKbVBiRCDOuM45R4Jxg_PPq7w/exec";

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.toggle('hidden');
    }

    const noPendaftar = localStorage.getItem('noPendaftaran') || 'SPMB-27-001';
    if (document.getElementById('teksNoPendaftaran')) {
      document.getElementById('teksNoPendaftaran').innerText = 'No: ' + noPendaftar;
    }

    const namaSantri = localStorage.getItem('namaCalonSantri');
    if (namaSantri && namaSantri.trim() !== '') {
      document.getElementById('teksHeader').innerText = namaSantri;
      const kata = namaSantri.trim().split(/\s+/);
      let inisial = kata.length >= 2 ? kata[0].charAt(0) + kata[kata.length - 1].charAt(0) : kata[0].substring(0, 2);
      document.getElementById('teksInisial').innerText = inisial.toUpperCase();
    }

    // Fungsi konversi file ke Base64 (Kompres otomatis jika foto)
    const toBase64 = file => new Promise((resolve, reject) => {
      if (!file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ base64: reader.result.split(',')[1], mimeType: file.type, name: file.name });
        reader.onerror = error => reject(error);
        return;
      }

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const MAX_SIZE = 1024;

          if (width > height) {
            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
          } else {
            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
          resolve({
            base64: dataUrl.split(',')[1],
            mimeType: 'image/jpeg',
            name: file.name.replace(/\.[^/.]+$/, "") + ".jpg"
          });
        };
        img.onerror = error => reject(error);
      };
      reader.onerror = error => reject(error);
    });

    document.getElementById('formBerkas').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnUpload');
      const fPasFoto = document.getElementById('filePasFoto').files[0];
      const fKK = document.getElementById('fileKK').files[0];
      const fAkta = document.getElementById('fileAkta').files[0];
      const fIjazah = document.getElementById('fileIjazah').files[0];

      if (!fPasFoto || !fKK || !fAkta || !fIjazah) {
        alert('⚠️ Mohon pilih semua 4 berkas persyaratan!');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i> <span>Sedang Mengompres & Mengunggah Berkas...</span>';

      try {
        const payload = {
          noPendaftaran: noPendaftar,
          pasFoto: await toBase64(fPasFoto),
          kartuKeluarga: await toBase64(fKK),
          aktaKelahiran: await toBase64(fAkta),
          ijazah: await toBase64(fIjazah)
        };

        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        alert('✅ Semua Berkas Berhasil Diunggah!');
        window.location.href = 'pembayaran.html';

      } catch (err) {
        console.error(err);
        alert('⚠️ Gagal mengunggah berkas. Periksa koneksi internet Anda.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload"></i> <span>Unggah Semua Berkas</span>';
      }
    });
  </script>
</body>
</html>
