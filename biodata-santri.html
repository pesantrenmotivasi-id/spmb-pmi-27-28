<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata Santri | Pesantren Motivasi Indonesia</title>
  <link rel="icon" type="image/png" href="1.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    
    :root {
      --coklat-logo: #4A2B12; 
      --gold-logo: #C29B57;   
      --bg-krem: #FAF8F5;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-krem);
      color: #2C2A29;
    }
    .font-serif-custom { font-family: 'Playfair Display', serif; }
    
    .bg-coklat-logo { background-color: var(--coklat-logo); }
    .text-coklat-logo { color: var(--coklat-logo); }
    .border-coklat-logo { border-color: var(--coklat-logo); }
    
    .bg-gold { background-color: var(--gold-logo); }
    .text-gold { color: var(--gold-logo); }
    .border-gold { border-color: var(--gold-logo); }
  </style>
</head>
<body class="flex h-screen overflow-hidden bg-[#FAF8F5]">

  <!-- SIDEBAR (Kiri) -->
  <aside class="w-64 bg-coklat-logo text-white flex flex-col shadow-2xl hidden md:flex relative z-20">
    <div class="p-6 flex items-center gap-4 border-b border-white/10">
      <img src="1.png" alt="Logo PMI" class="w-12 h-12 bg-white rounded-full p-1 object-contain">
      <div>
        <h1 class="font-bold font-serif-custom text-gold leading-tight">SPMB PMI</h1>
        <p class="text-[10px] text-gray-300">Tahun Ajaran 2027/2028</p>
      </div>
    </div>

    <!-- Menu Navigasi -->
    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
      <a href="dashboard-santri.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-home w-5 text-center"></i> Beranda
      </a>
      <a href="biodata-santri.html" class="flex items-center gap-3 px-4 py-3 bg-gold/20 text-gold rounded-xl border border-gold/30 font-semibold transition-all">
        <i class="fas fa-user-edit w-5 text-center"></i> Biodata Diri
      </a>
      <a href="upload-berkas.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-file-upload w-5 text-center"></i> Upload Berkas
      </a>
      <a href="pembayaran.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-wallet w-5 text-center"></i> Pembayaran
      </a>
      <a href="pengumuman.html" class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-white/10 hover:text-white rounded-xl transition-all">
        <i class="fas fa-bullhorn w-5 text-center"></i> Pengumuman
      </a>
    </nav>

    <div class="p-4 border-t border-white/10">
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-xl transition-all">
        <i class="fas fa-sign-out-alt w-5 text-center"></i> Keluar
      </a>
    </div>
  </aside>

  <!-- MAIN CONTENT (Kanan) -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <!-- HEADER -->
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center z-10">
      <button class="md:hidden text-coklat-logo text-xl">
        <i class="fas fa-bars"></i>
      </button>

      <h2 class="text-xl font-bold text-gray-800 hidden md:block">Kelengkapan Biodata Diri</h2>

      <div class="flex items-center gap-6">
        <a href="pengumuman.html" class="text-gray-400 hover:text-gold relative transition-colors">
          <i class="fas fa-bell text-xl"></i>
          <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
        </a>
        
        <div class="flex items-center gap-3 border-l pl-6 border-gray-200">
          <div class="text-right hidden sm:block">
            <p id="teksHeader" class="text-sm font-bold text-gray-800">Calon Santri</p>
            <p id="teksNoPendaftaran" class="text-xs text-gray-500">No: SPMB-27-000</p>
          </div>
          <div id="teksInisial" class="w-10 h-10 rounded-full bg-coklat-logo text-white flex items-center justify-center font-bold font-serif-custom shadow-md border-2 border-gold">
            CS
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT SCROLLABLE AREA -->
    <div class="flex-1 overflow-y-auto p-6 md:p-8">
      <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100">
          
          <h3 class="text-xl font-bold font-serif-custom text-coklat-logo mb-6 border-b pb-4">
            <i class="fas fa-id-card text-gold mr-2"></i> Form Data Calon Santri & Orang Tua
          </h3>

          <form id="formBiodata" class="space-y-6">
            
            <!-- DATA SANTRI -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nama Lengkap Santri</label>
                <input type="text" id="inputNama" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">NISN</label>
                <input type="number" id="inputNisn" placeholder="10 Digit NISN" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Jenis Kelamin</label>
                <select id="inputJenisKelamin" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
                  <option value="">-- Pilih Jenis Kelamin --</option>
                  <option value="Laki-laki">Laki-laki</option>
                  <option value="Perempuan">Perempuan</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Tempat Lahir</label>
                <input type="text" id="inputTempatLahir" placeholder="Contoh: Bekasi" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
              </div>

              <div class="md:col-span-2">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Tanggal Lahir</label>
                <input type="date" id="inputTanggalLahir" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
              </div>
            </div>

            <!-- DATA ORANG TUA / WALI -->
            <hr class="my-6">
            <h4 class="font-bold text-gray-800 text-sm uppercase tracking-wide">Data Orang Tua / Wali</h4>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nama Ayah Kandung</label>
                <input type="text" id="inputNamaAyah" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nama Ibu Kandung</label>
                <input type="text" id="inputNamaIbu" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
              </div>

              <div class="md:col-span-2">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">No. HP Wali / Ortu</label>
                <input type="tel" id="inputNoHpWali" placeholder="08xxxxxxxxxx" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold">
              </div>

              <div class="md:col-span-2">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Alamat Lengkap Rumah</label>
                <textarea id="inputAlamat" rows="3" placeholder="Jalan, RT/RW, Kelurahan, Kecamatan, Kota/Kabupaten" required class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-gold"></textarea>
              </div>
            </div>

            <button type="submit" id="btnSimpan" class="w-full bg-gold hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-gold/30 transition-all flex items-center justify-center gap-2 mt-6">
              <i class="fas fa-save"></i> <span>Simpan & Lanjutkan</span>
            </button>
          </form>

        </div>
      </div>
    </div>
  </main>

  <script>
    // URL Web App Google Apps Script Khusus Biodata
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRttWfxyqta4tTpJnwDO2i0mOhwReT0wmh0ULSHj9YcvnEvKHd16KfHQjvnoPHA0mV2w/exec";

    // 1. Load Data dari localStorage ke Header & Form Input
    const noPendaftar = localStorage.getItem('noPendaftaran') || 'SPMB-27-001';
    if (document.getElementById('teksNoPendaftaran')) {
      document.getElementById('teksNoPendaftaran').innerText = 'No: ' + noPendaftar;
    }

    const namaSantri = localStorage.getItem('namaCalonSantri');
    if (namaSantri && namaSantri.trim() !== '') {
      document.getElementById('teksHeader').innerText = namaSantri;
      document.getElementById('inputNama').value = namaSantri;

      const kata = namaSantri.trim().split(/\s+/);
      let inisial = '';
      if (kata.length >= 2) {
        inisial = kata[0].charAt(0) + kata[kata.length - 1].charAt(0);
      } else if (kata.length === 1 && kata[0].length > 0) {
        inisial = kata[0].substring(0, 2);
      }
      document.getElementById('teksInisial').innerText = inisial.toUpperCase();
    }

    // 2. Kirim Data Biodata Pas dengan Kolom Google Sheets
    document.getElementById('formBiodata').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan Data...';

      const payload = {
        noPendaftaran: noPendaftar,
        namaLengkap: document.getElementById('inputNama').value,
        nisn: document.getElementById('inputNisn').value,
        jenisKelamin: document.getElementById('inputJenisKelamin').value,
        tempatLahir: document.getElementById('inputTempatLahir').value,
        tanggalLahir: document.getElementById('inputTanggalLahir').value,
        namaAyah: document.getElementById('inputNamaAyah').value,
        namaIbu: document.getElementById('inputNamaIbu').value,
        noHpWali: document.getElementById('inputNoHpWali').value,
        alamat: document.getElementById('inputAlamat').value
      };

      // Simpan ke LocalStorage
      localStorage.setItem('namaCalonSantri', payload.namaLengkap);
      localStorage.setItem('biodataSelesai', 'true');

      // Kirim ke Apps Script
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert('Data Biodata Berhasil Disimpan!');
        window.location.href = 'upload-berkas.html';
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Gagal menyimpan biodata, silakan coba lagi.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Simpan & Lanjutkan';
      });
    });
  </script>
</body>
</html>
