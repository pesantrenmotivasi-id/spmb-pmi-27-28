<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[Nama Halaman] | Pesantren Motivasi Indonesia</title>
  <link rel="icon" type="image/png" href="1.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    
    :root {
      --coklat-logo: #4A2B12; 
      --gold-logo: #C29B57;   
      --bg-krem: #FAF8F5;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-krem);
      color: #2C2A29;
    }
    .font-serif-custom { font-family: 'Playfair Display', serif; }
    
    .bg-coklat-logo { background-color: var(--coklat-logo); }
    .text-coklat-logo { color: var(--coklat-logo); }
    .border-coklat-logo { border-color: var(--coklat-logo); }
    
    .bg-gold { background-color: var(--gold-logo); }
    .text-gold { color: var(--gold-logo); }
    .border-gold { border-color: var(--gold-logo); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#FAF8F5]">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 p-8 relative overflow-hidden">
    
    <!-- Header Logo & Judul -->
    <div class="text-center mb-8">
      <img src="1.png" alt="Logo PMI" class="w-20 h-20 mx-auto mb-3 object-contain">
      <h1 class="text-2xl font-bold font-serif-custom text-[#4A2B12]">Portal Admin SPMB</h1>
      <p class="text-xs text-gray-500 mt-1">Khusus Panitia Pesantren Motivasi Indonesia</p>
    </div>

    <!-- Form Login Admin -->
    <form id="formLoginAdmin" class="space-y-4">
      
      <!-- Username -->
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Username Admin</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fas fa-user-shield"></i>
          </span>
          <input type="text" id="inputUserAdmin" required placeholder="Masukkan username" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#C29B57] transition-colors">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Kata Sandi (Password)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fas fa-key"></i>
          </span>
          <input type="password" id="inputPassAdmin" required placeholder="******" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#C29B57] transition-colors">
        </div>
      </div>

      <!-- Tombol Submit -->
      <button type="submit" class="w-full bg-[#C29B57] hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-[#C29B57]/30 transition-all flex items-center justify-center gap-2 mt-6">
        <span>Masuk Dashboard Admin</span>
        <i class="fas fa-[#C29B57]"></i>
        <i class="fas fa-sign-in-alt"></i>
      </button>

    </form>

    <div class="text-center mt-6 pt-6 border-t border-gray-100">
      <p class="text-xs text-gray-400">
        Bukan Panitia? <a href="index.html" class="text-[#4A2B12] font-bold hover:underline">Ke Halaman Depan</a>
      </p>
    </div>

  </div>

<script>
    document.getElementById('formLoginAdmin').addEventListener('submit', function(e) {
      e.preventDefault();

      const user = document.getElementById('inputUserAdmin').value.trim();
      const pass = document.getElementById('inputPassAdmin').value.trim();

      // Cek Username & Password Admin
      if (user === 'admin' && pass === 'admin123') {
        alert('Login Admin Berhasil!');
        // Langsung lempar ke dashboard admin dengan tiket sukses (bypass localStorage)
        window.location.href = 'admin-dashboard.html?status=sukses';
      } else {
        alert('Username atau Password Admin Salah!\n(Gunakan: admin / admin123)');
      }
    });
  </script>
</body>
</html>
