<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin SPMB | Pesantren Motivasi Indonesia</title>
  <link rel="icon" type="image/png" href="1.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              DEFAULT: '#0F2942', // Deep Ocean Navy
              dark: '#0A1C2E',
              light: '#1E40AF',
              soft: '#F0F4F8'
            },
            gold: {
              DEFAULT: '#D4AF37', // Gold Elegance
              hover: '#B89328',
              light: '#FDF8EC',
              border: '#E5C158'
            },
            bgApp: '#F8FAFC'
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
      color: #1E293B;
    }
    .font-serif-custom { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-bgApp">

  <!-- CARD CONTAINER LOGIN ADMIN -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 relative overflow-hidden">
    
    <!-- AKSEN DEKORASI ATAS -->
    <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-ocean via-gold to-ocean"></div>

    <!-- HEADER LOGO & JUDUL -->
    <div class="text-center mb-8 pt-2">
      <div class="w-20 h-20 mx-auto mb-3 rounded-full p-1 bg-white border-2 border-gold/40 shadow-md flex items-center justify-center">
        <img src="1.png" alt="Logo PMI" class="w-full h-full object-contain">
      </div>
      <h1 class="text-2xl font-bold font-serif-custom text-ocean">Portal Admin SPMB</h1>
      <p class="text-xs text-slate-500 mt-1">Khusus Panitia Pesantren Motivasi Indonesia</p>
    </div>

    <!-- FORM LOGIN ADMIN -->
    <form id="formLoginAdmin" class="space-y-4">
      
      <!-- Username -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Username Admin</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fas fa-user-shield"></i>
          </span>
          <input type="text" id="inputUserAdmin" required placeholder="Masukkan username" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm text-slate-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition-colors">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kata Sandi (Password)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fas fa-key"></i>
          </span>
          <input type="password" id="inputPassAdmin" required placeholder="******" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm text-slate-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition-colors">
        </div>
      </div>

      <!-- Tombol Submit -->
      <button type="submit" class="w-full bg-ocean hover:bg-ocean-dark text-white font-bold py-3.5 rounded-xl shadow-lg shadow-ocean/20 transition-all flex items-center justify-center gap-2 mt-6 border border-gold/30">
        <span>Masuk Dashboard Admin</span>
        <i class="fas fa-sign-in-alt text-gold"></i>
      </button>

    </form>

    <!-- FOOTER NAVIGASI KEMBALI -->
    <div class="text-center mt-6 pt-6 border-t border-slate-100">
      <p class="text-xs text-slate-400">
        Bukan Panitia? <a href="index.html" class="text-ocean font-bold hover:text-gold hover:underline transition-colors">Ke Halaman Depan</a>
      </p>
    </div>

  </div>

  <script>
    document.getElementById('formLoginAdmin').addEventListener('submit', function(e) {
      e.preventDefault();

      const user = document.getElementById('inputUserAdmin').value.trim();
      const pass = document.getElementById('inputPassAdmin').value.trim();

      // Cek Username & Password Admin
      if (user === 'admin' && pass === 'admin123') {
        alert('Login Admin Berhasil!');
        // Langsung lempar ke dashboard admin dengan tiket sukses (bypass localStorage)
        window.location.href = 'admin-dashboard.html?status=sukses';
      } else {
        alert('Username atau Password Admin Salah!\n(Gunakan: admin / admin123)');
      }
    });
  </script>
</body>
</html>
